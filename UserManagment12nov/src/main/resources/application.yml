server:
  port: 8088
  address: 0.0.0.0
management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  endpoint:
    prometheus:
      enabled: true
spring:
  application:
    name: USERMANAGEMENT
eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
cloud:
  aws:
    stack:
      auto: false
    ec2:
      metadata:
        enabled: false
